<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>单词学习 PRO</title>
<style>
:root { --primary: #4f46e5; --bg: #f3f4f6; --text: #1f2937; --card: #ffffff; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin:0; font-family:-apple-system,"HarmonyOS Sans",system-ui,sans-serif; background:var(--bg); color:var(--text); padding-bottom:70px; }
header { background:var(--primary); color:#fff; padding:16px; font-size:20px; font-weight:600; position:sticky; top:0; z-index:10; display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 10px rgba(79,70,229,.2);}
.loading { font-size:13px; font-weight:normal; opacity:0.8; }
.tabbar { position:fixed; bottom:0; left:0; right:0; display:flex; background:#fff; border-top:1px solid #e5e7eb; padding-bottom:env(safe-area-inset-bottom); z-index:10;}
.tabbar button { flex:1; border:0; background:none; padding:12px 0; font-size:15px; color:#6b7280; font-weight:500; transition:all 0.2s;}
.tabbar button.active { color:var(--primary); font-weight:bold; }
.page { display:none; padding:16px; max-width: 800px; margin: 0 auto; }
.page.active { display:block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
input[type=text] { width:100%; padding:14px 16px; font-size:16px; border:2px solid #e5e7eb; border-radius:12px; outline:none; transition:border 0.2s; background:#fff; }
input[type=text]:focus { border-color:var(--primary); }
.btn { display:inline-flex; justify-content:center; align-items:center; padding:12px 20px; border-radius:12px; border:0; background:var(--primary); color:#fff; font-size:16px; margin-top:12px; font-weight:600; cursor:pointer; transition: opacity 0.2s; width:100%;}
.btn.gray { background:#e5e7eb; color:#374151; }
.btn:active { opacity:0.8; }
.card { background:var(--card); border-radius:16px; padding:20px; margin-top:16px; box-shadow:0 4px 20px rgba(0,0,0,.05); }
.card h2 { margin:0 0 4px; font-size:28px; color:#111827; font-family: Georgia, serif;}
.phonetic { font-size:15px; color:#6b7280; margin-bottom:16px; font-family: monospace;}
.field { margin:12px 0; font-size:16px; line-height:1.6; color:#374151; }
.field-title { font-weight:bold; color:var(--primary); font-size:14px; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; display:flex; align-items:center;}
.field-title::after { content:""; flex:1; height:1px; background:#e5e7eb; margin-left:10px; }
.detail-box { background:#f8fafc; border-left:4px solid var(--primary); padding:12px; border-radius:0 8px 8px 0; margin-bottom:12px;}
.tag { display:inline-block; background:#e0e7ff; color:#4338ca; padding:4px 10px; border-radius:6px; font-size:13px; margin:0 6px 6px 0; }
.ex-item { margin-bottom:10px; padding-bottom:10px; border-bottom:1px dashed #e5e7eb; font-size:15px; line-height:1.5;}
.ex-en { color:#111827; font-weight:500; }
.item { background:#fff; border-radius:14px; padding:16px; margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,.04);}
.item .w { font-size:20px; font-weight:bold; color:#111827;}
.item .m { font-size:14px; color:#6b7280; margin-top:6px; line-height:1.5;}
.item .due { font-size:12px; color:#ea580c; margin-top:8px; font-weight:bold; display:inline-block; background:#ffedd5; padding:4px 10px; border-radius:6px;}
.badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:8px; background:#e0e7ff; color:var(--primary); margin-left:8px; vertical-align:middle;}
.empty { text-align:center; color:#9ca3af; padding:60px 0; font-size:15px; }
</style>
</head>
<body>
<header>
  <span>单词学习 PRO</span>
  <span id="status" class="loading">加载中...</span>
</header>

<div id="page-search" class="page active">
  <input id="q" type="text" placeholder="输入英文单词（如 propose）" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <button class="btn" onclick="doSearch()">查询</button>
  <div id="result"></div>
</div>

<div id="page-vocab" class="page">
  <div id="vocabList"></div>
</div>

<div id="page-review" class="page">
  <button class="btn gray" onclick="startReview(false)">复习所有词</button>
  <button class="btn" onclick="startReview(true)">仅复习到期词</button>
  <div id="reviewBox"></div>
</div>

<div class="tabbar">
  <button class="active" onclick="showTab('search',this)">查词</button>
  <button onclick="showTab('vocab',this)">生词本</button>
  <button onclick="showTab('review',this)">复习</button>
</div>

<script>
let DICT = {}; 
const VOCAB_KEY = 'vocab_data_v3';

function loadVocab() { try { return JSON.parse(localStorage.getItem(VOCAB_KEY) || '[]'); } catch(e) { return []; } }
function saveVocab(v) { localStorage.setItem(VOCAB_KEY, JSON.stringify(v)); }

async function loadDict() {
  const status = document.getElementById('status');
  try {
    const resp = await fetch('dictionary.csv');
    if (!resp.ok) throw new Error('no file');
    const text = await resp.text();
    const lines = text.split('\n');
    let count = 0;
    for (let i = 1; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;
      const f = parseCSV(line);
      if (f.length >= 2) {
        // 这里的 s 代表同义词，e 代表例句
        DICT[f[0].toLowerCase()] = { w: f[0], m: f[1], s: f[2]||'', e: f[3]||'' };
        count++;
      }
    }
    status.innerText = `词库就绪 (${count} 词)`;
  } catch(e) {
    status.innerText = `词库加载失败`;
  }
}

function parseCSV(line) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) { if (c === '"' && line[i+1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else { if (c === '"') q = true; else if (c === ',') { out.push(cur); cur = ''; } else cur += c; }
  }
  out.push(cur); return out;
}

function showTab(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (name === 'vocab') renderVocab();
  if (name === 'review') document.getElementById('reviewBox').innerHTML = '';
}

function doSearch() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  if (!q) return;
  const item = DICT[q];
  const box = document.getElementById('result');
  
  if (!item) { box.innerHTML = '<div class="empty">本地词库中未找到该词</div>'; return; }
  
  let html = `<div class="card"><h2>${esc(item.w)}</h2>`;
  
  html += `<div class="field"><div class="field-title">释义</div><div class="detail-box">${esc(item.m)}</div></div>`;

  // 如果有同义词，就展示同义词
  if (item.s) {
    html += `<div class="field"><div class="field-title">同义词 / 词形变化</div>`;
    item.s.split(',').forEach(s => {
      if(s.trim()) html += `<span class="tag">${esc(s.trim())}</span>`;
    });
    html += `</div>`;
  }

  // 如果有例句，就展示例句
  if (item.e) {
    html += `<div class="field"><div class="field-title">例句</div>
      <div class="ex-item"><div class="ex-en">"${esc(item.e)}"</div></div>
    </div>`;
  }

  // 如果既没有同义词也没有例句，给个提示
  if (!item.s && !item.e) {
    html += `<div style="color:#9ca3af;font-size:13px;margin:10px 0;">当前词库不包含该词的同义词和例句（需替换带有扩展数据的词库）。</div>`;
  }

  const vi = isInVocab(q);
  if (vi >= 0) html += `<button class="btn gray" style="margin-top:20px;" onclick="removeVocab('${escAttr(q)}')">从生词本移除</button>`;
  else html += `<button class="btn" style="margin-top:20px;" onclick="addVocab('${escAttr(q)}')">加入生词本</button>`;

  box.innerHTML = html + `</div>`;
}

function isInVocab(w) { return loadVocab().findIndex(v => v.word.toLowerCase() === w.toLowerCase()); }
function addVocab(w) { const v = loadVocab(); if (v.findIndex(x => x.word.toLowerCase() === w.toLowerCase()) >= 0) return; v.push({ word: w, ease: 3, interval: 0, reps: 0, lapses: 0, due: 0 }); saveVocab(v); doSearch(); }
function removeVocab(w) { const v = loadVocab().filter(x => x.word.toLowerCase() !== w.toLowerCase()); saveVocab(v); doSearch(); }

function renderVocab() {
  const v = loadVocab();
  const box = document.getElementById('vocabList');
  if (v.length === 0) { box.innerHTML = '<div class="empty">生词本空空如也<br>快去查词加进来吧</div>'; return; }
  const now = Date.now() / 1000;
  box.innerHTML = v.map(it => {
    const mean = DICT[it.word.toLowerCase()] ? DICT[it.word.toLowerCase()].m : '(词库未收录)';
    const due = it.due <= now ? '<div class="due">⏰ 待复习</div>' : '';
    return `<div class="item"><div class="w">${esc(it.word)}<span class="badge">熟练度 ${it.ease}</span></div><div class="m">${esc(mean)}</div>${due}</div>`;
  }).join('');
}

let rQueue = [], rCur = 0, rMode = 1;
function startReview(onlyDue) {
  const now = Date.now() / 1000;
  const v = loadVocab();
  rQueue = onlyDue ? v.filter(x => x.due <= now) : v.slice();
  if (rQueue.length === 0) { document.getElementById('reviewBox').innerHTML = '<div class="empty">没有需要复习的词</div>'; return; }
  rCur = 0; rMode = Math.random() < 0.5 ? 1 : 2; renderReviewCard();
}

function renderReviewCard() {
  if (rCur >= rQueue.length) { document.getElementById('reviewBox').innerHTML = '<div class="empty">本轮复习完成 🎉</div>'; return; }
  const it = rQueue[rCur], dict = DICT[it.word.toLowerCase()];
  if (!dict) { rCur++; renderReviewCard(); return; }
  const box = document.getElementById('reviewBox');
  if (rMode === 1) {
    box.innerHTML = `<div class="card"><div class="field-title" style="color:#6b7280">【中译英】看释义拼英文</div>
      <div class="detail-box" style="font-size:18px;margin:16px 0;">${esc(dict.m)}</div>
      <input id="ans" type="text" placeholder="在此输入英文" autocapitalize="off" spellcheck="false" style="margin-top:16px">
      <button class="btn" onclick="checkReview()">提交答案</button></div>`;
  } else {
    box.innerHTML = `<div class="card"><div class="field-title" style="color:#6b7280">【英译中】看英文想中文</div>
      <h2 style="font-size:32px;margin:16px 0">${esc(dict.w)}</h2>
      <input id="ans" type="text" placeholder="在此输入中文释义" style="margin-top:16px">
      <button class="btn" onclick="checkReview()">提交答案</button></div>`;
  }
}

function checkReview() {
  const it = rQueue[rCur], dict = DICT[it.word.toLowerCase()];
  const ans = (document.getElementById('ans').value || '').trim();
  let ok = false;
  if (rMode === 1) ok = ans.toLowerCase() === dict.w.toLowerCase();
  else ok = dict.m.includes(ans) || (ans.length > 0 && ans.includes(dict.m.split('；')[0].split(';')[0].replace(/[a-zA-Z.]/g, '').trim()));

  const v = loadVocab(), vi = v.findIndex(x => x.word.toLowerCase() === it.word.toLowerCase()), now = Date.now() / 1000;
  if (vi >= 0) {
    const item = v[vi];
    if (ok) {
      item.reps++; if (item.interval === 0) item.interval = 1; else if (item.interval === 1) item.interval = 3; else item.interval = Math.min(365, Math.floor(item.interval * (item.ease + 1) / 2));
      if (item.ease < 5) item.ease++; item.due = now + item.interval * 86400;
    } else {
      item.lapses++; item.reps = 0; item.interval = 0; if (item.ease > 1) item.ease--; item.due = now + 600;
    }
    saveVocab(v);
  }

  const box = document.getElementById('reviewBox'), correctAns = rMode === 1 ? dict.w : dict.m;
  box.innerHTML = `<div class="card"><div class="field" style="font-size:24px;color:${ok ? '#10b981' : '#ef4444'};margin-bottom:16px;font-weight:bold;">${ok ? '✔ 完全正确' : '✘ 回答错误'}</div>
    <div class="detail-box"><b>正确答案：</b>${esc(correctAns)}</div>
    <button class="btn gray" style="margin-top:20px" onclick="nextReview()">下一个</button></div>`;
}

function nextReview() { rCur++; rMode = Math.random() < 0.5 ? 1 : 2; renderReviewCard(); }
function esc(s) { return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escAttr(s) { return (s||'').replace(/'/g, "\\'"); }
loadDict();
</script>
</body>
</html>
